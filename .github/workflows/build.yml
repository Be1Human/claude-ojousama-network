name: Desktop build and tests
on:
  push:
    branches: ['**']
    paths-ignore: ['docs/**', 'README.md']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  desktop:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS Apple Silicon
            os: macos-14
            platform: mac
            arch: arm64
            executable: dist/mac-arm64/Claude Ojou Network.app/Contents/MacOS/Claude Ojou Network
          - name: macOS Intel
            os: macos-15-intel
            platform: mac
            arch: x64
            executable: dist/mac/Claude Ojou Network.app/Contents/MacOS/Claude Ojou Network
          - name: Windows x64
            os: windows-latest
            platform: win
            arch: x64
            executable: dist/win-unpacked/Claude Ojou Network.exe
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run test:ui
        timeout-minutes: 3
      - run: npx electron-builder --${{ matrix.platform }} --${{ matrix.arch }} --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Verify packaged application
        timeout-minutes: 3
        run: npm run test:ui
        env:
          OJOU_EXECUTABLE: ${{ matrix.executable }}
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.platform }}-${{ matrix.arch }}
          if-no-files-found: error
          retention-days: 5
          path: |
            dist/*.dmg
            dist/*.zip
            dist/*.exe
      - name: Upload demo screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshot-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            test-results/application-demo.png
            test-results/china-warning-demo.png
